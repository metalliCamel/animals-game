<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pies na Tropie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
  <div class="top">
    <div class="logo">Pies na Tropie</div>
    <div class="top-btns">
      <button class="btn ghost" id="menuBtn" type="button" hidden>Menu</button>
      <button class="btn ghost" id="wardrobeBtn" type="button" hidden>Szafa</button>
      <button class="btn ghost" id="albumBtn" type="button" hidden>Album</button>
      <button class="btn ghost" id="readBtn" type="button" aria-pressed="false" hidden>Czytanie: wyłączone</button>
      <button class="btn ghost" id="mapBtn" type="button" hidden>Mapa</button>
      <button class="btn ghost" id="soundBtn" type="button" aria-pressed="true">Głos: włączony</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div id="world" class="world"></div>

    <div class="overlay start" id="startScreen" hidden>
      <div class="start-body" id="startBody"></div>
    </div>

    <div class="overlay" id="nameScreen" hidden>
      <div class="namepup" id="namePup"></div>
      <h1>Jak ma na imię piesek?</h1>
      <input class="namebox" id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" placeholder="IMIĘ" aria-label="Imię pieska">
      <div class="sugg" id="sugg">
        <button class="btn ghost" type="button">Burek</button>
        <button class="btn ghost" type="button">Łatka</button>
        <button class="btn ghost" type="button">Kropka</button>
        <button class="btn ghost" type="button">Reksio</button>
      </div>
      <div class="sugg">
        <button class="btn" id="startBtn" type="button">Gotowe! Gramy</button>
        <button class="btn ghost" id="nameBack" type="button">Wróć</button>
      </div>
    </div>

    <div class="overlay album" id="albumScreen" hidden>
      <h1>Album przyjaciół</h1>
      <div class="cards" id="cards"></div>
      <button class="btn" id="albumClose" type="button">Na mapę</button>
    </div>

    <div class="overlay wardrobe" id="wardrobeScreen" hidden>
      <div class="tasks-head">
        <h1 id="wardrobeTitle">Szafa pieska</h1>
        <button class="btn" id="wardrobeClose" type="button">Gotowe!</button>
      </div>
      <div class="wr-body">
        <div class="wr-preview"><div class="wr-face" id="wrFace"></div><div class="wr-side" id="wrSide"></div></div>
        <div class="wr-pick">
          <div class="wr-tabs" id="wrTabs"></div>
          <div class="wr-items" id="wrItems"></div>
        </div>
      </div>
    </div>

    <div class="overlay tasks" id="taskScreen" hidden>
      <div class="tasks-head">
        <h1>Co trzeba zrobić?</h1>
        <button class="btn" id="taskClose" type="button">Wracamy do zabawy</button>
      </div>
      <div class="task-rows" id="taskRows"></div>
    </div>

    <div class="overlay" id="endScreen" hidden>
      <div class="sticker" id="sticker"></div>
      <h1 id="endTitle">Brawo!</h1>
      <p id="endText"></p>
      <div class="sugg">
        <button class="btn" id="toMapBtn" type="button">Na mapę</button>
        <button class="btn ghost" id="againBtn" type="button">Jeszcze raz</button>
      </div>
    </div>
  </div>

  <button class="rename" id="renameBtn" type="button" hidden>Zmień imię pieska</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
