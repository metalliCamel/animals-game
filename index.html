<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pies na Tropie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<div class="top">
  <div class="logo">Pies na Tropie</div>
  <button class="btn ghost" id="soundBtn" aria-pressed="true">Głos: włączony</button>
</div>

<div class="stage" id="stage">
  <div class="sunball"></div>
  <div class="cloud" style="top:10%;animation-delay:-8s"></div>
  <div class="cloud" style="top:22%;height:7%;animation-delay:-26s;animation-duration:55s"></div>
  <div class="ground" id="ground"></div>

  <div class="chip" id="chip"><svg class="ic" viewBox="0 0 40 40"><use href="#yarnSym"/></svg><span id="chipText">Znajdź kłębek</span></div>

  <div class="ent tree" style="left:11%;bottom:38%;z-index:5"><svg viewBox="0 0 120 150"><rect x="50" y="80" width="20" height="70" rx="6" fill="#9A6A3C"/><circle cx="60" cy="55" r="45" fill="#5EAA45"/><circle cx="30" cy="75" r="28" fill="#6DBB50"/><circle cx="90" cy="72" r="30" fill="#4F9A3B"/><circle cx="48" cy="40" r="6" fill="#E2525C"/><circle cx="78" cy="58" r="6" fill="#E2525C"/><circle cx="36" cy="70" r="6" fill="#E2525C"/></svg></div>

  <button class="ent hit bush" data-i="0" style="left:30%;bottom:30%" aria-label="Krzak"><svg viewBox="0 0 120 80"><use href="#bushSym"/></svg></button>
  <button class="ent hit bush" data-i="1" style="left:52%;bottom:14%" aria-label="Krzak"><svg viewBox="0 0 120 80"><use href="#bushSym"/></svg></button>
  <button class="ent hit bush" data-i="2" style="left:66%;bottom:34%" aria-label="Krzak"><svg viewBox="0 0 120 80"><use href="#bushSym"/></svg></button>

  <div class="ent" id="yarn"><svg viewBox="0 0 40 40"><use href="#yarnSym"/></svg></div>

  <button class="ent hit" id="cat" style="left:86%;bottom:22%" aria-label="Kotek">
    <svg viewBox="0 0 100 110">
      <path d="M78 95 C100 90 98 60 86 58" stroke="#E08A35" stroke-width="9" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="80" rx="28" ry="26" fill="#F0A04B"/>
      <path d="M36 70 q6 6 0 12 M50 66 q6 8 0 16 M64 70 q6 6 0 12" stroke="#D9802F" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="38" cy="104" rx="9" ry="5" fill="#F7B86A"/><ellipse cx="62" cy="104" rx="9" ry="5" fill="#F7B86A"/>
      <path d="M24 36 L28 8 L44 26 Z M76 36 L72 8 L56 26 Z" fill="#F0A04B"/><path d="M29 28 L31 15 L39 25 Z M71 28 L69 15 L61 25 Z" fill="#F7C9C9"/>
      <circle cx="50" cy="40" r="26" fill="#F0A04B"/>
      <circle cx="40" cy="38" r="4.5" fill="#2E3A2A"/><circle cx="60" cy="38" r="4.5" fill="#2E3A2A"/>
      <circle cx="41.5" cy="36.5" r="1.5" fill="#fff"/><circle cx="61.5" cy="36.5" r="1.5" fill="#fff"/>
      <path d="M47 46 L53 46 L50 50 Z" fill="#E2525C"/><path d="M44 53 q6 5 12 0" stroke="#2E3A2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M30 48 L14 45 M30 52 L15 55 M70 48 L86 45 M70 52 L85 55" stroke="#7A5530" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="ent" id="dog" style="left:22%;bottom:10%">
    <div class="flip"><div class="bob">
      <svg viewBox="0 0 130 100">
        <path d="M22 50 C8 40 10 22 18 18" stroke="#B87638" stroke-width="9" fill="none" stroke-linecap="round"/>
        <rect x="30" y="62" width="11" height="30" rx="5" fill="#B87638"/><rect x="68" y="62" width="11" height="30" rx="5" fill="#B87638"/>
        <ellipse cx="55" cy="58" rx="36" ry="22" fill="#D6964F"/>
        <ellipse cx="42" cy="52" rx="12" ry="9" fill="#8A5528"/>
        <rect x="40" y="66" width="11" height="28" rx="5" fill="#D6964F"/><rect x="78" y="66" width="11" height="28" rx="5" fill="#D6964F"/>
        <path d="M80 52 q8 -4 14 4" stroke="#E2525C" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="96" cy="36" r="22" fill="#D6964F"/>
        <ellipse cx="112" cy="44" rx="14" ry="10" fill="#F1C48E"/>
        <circle cx="124" cy="40" r="5.5" fill="#2E3A2A"/>
        <circle cx="100" cy="30" r="4.5" fill="#2E3A2A"/><circle cx="101.5" cy="28.5" r="1.5" fill="#fff"/>
        <path d="M84 18 C70 18 70 46 80 50 C86 44 88 28 84 18 Z" fill="#8A5528"/>
        <path d="M110 52 q5 4 10 0" stroke="#2E3A2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="carry" viewBox="0 0 40 40"><use href="#yarnSym"/></svg>
    </div></div>
  </div>

  <div class="bubble" id="bubble" hidden></div>

  <div class="overlay" id="nameScreen">
    <svg class="namepup" viewBox="0 0 130 100"><use href="#pupFace"/></svg>
    <h1>Jak ma na imię piesek?</h1>
    <input class="namebox" id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" placeholder="IMIĘ" aria-label="Imię pieska">
    <div class="sugg" id="sugg">
      <button class="btn ghost" type="button">Burek</button><button class="btn ghost" type="button">Łatka</button><button class="btn ghost" type="button">Kropka</button><button class="btn ghost" type="button">Reksio</button>
    </div>
    <button class="btn" id="startBtn" type="button">Gotowe! Gramy</button>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <svg class="sticker" viewBox="0 0 120 120">
      <path d="M60 6 L74 40 L112 42 L82 66 L92 104 L60 83 L28 104 L38 66 L8 42 L46 40 Z" fill="#FFD25A" stroke="#E0A92E" stroke-width="5" stroke-linejoin="round"/>
      <g transform="translate(40 44) scale(.4)"><use href="#yarnSym" width="100" height="100"/></g>
    </svg>
    <h1 id="endTitle">Brawo!</h1>
    <p>Kotek ma swój kłębek. Dostajesz gwiazdkę pomocnika!</p>
    <div class="sugg"><button class="btn" id="againBtn" type="button">Jeszcze raz</button><button class="btn ghost" id="renameBtn" type="button">Nowe imię</button></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="yarnSym" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#E2525C"/><path d="M8 14 q12 6 24 -2 M6 22 q14 6 28 -4 M10 30 q10 2 22 -6 M16 5 q-6 14 4 30" stroke="#B8323C" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M33 28 q6 4 4 10" stroke="#E2525C" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="bushSym" viewBox="0 0 120 80"><ellipse cx="60" cy="76" rx="50" ry="5" fill="#0002"/><circle cx="30" cy="52" r="24" fill="#4E9E3C"/><circle cx="60" cy="38" r="30" fill="#5DB048"/><circle cx="90" cy="52" r="24" fill="#4E9E3C"/><rect x="10" y="50" width="100" height="26" rx="13" fill="#5DB048"/><circle cx="48" cy="32" r="5" fill="#8ED16E"/><circle cx="80" cy="46" r="4" fill="#8ED16E"/></symbol>
    <symbol id="pupFace" viewBox="0 0 130 100"><circle cx="65" cy="52" r="38" fill="#D6964F"/><path d="M38 22 C16 22 16 70 32 74 C42 64 44 38 38 22 Z M92 22 C114 22 114 70 98 74 C88 64 86 38 92 22 Z" fill="#8A5528"/><ellipse cx="65" cy="68" rx="20" ry="14" fill="#F1C48E"/><circle cx="65" cy="60" r="7" fill="#2E3A2A"/><circle cx="52" cy="44" r="5" fill="#2E3A2A"/><circle cx="78" cy="44" r="5" fill="#2E3A2A"/><path d="M58 74 q7 6 14 0" stroke="#2E3A2A" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="65" cy="84" rx="6" ry="7" fill="#E2525C"/></symbol>
  </defs>
</svg>
<script type="module" src="/src/main.js"></script>
</body>
</html>
